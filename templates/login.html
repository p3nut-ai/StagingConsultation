<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2563EB',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-primary p-8 rounded-lg shadow-lg w-full max-w-md">
        <h2 class="text-3xl font-bold mb-6 text-center text-white">Login</h2>
        <form class="space-y-6" action="{{ url_for('login') }}" method="post">
            <div>
                <label for="email" class="block text-sm font-medium text-white mb-1">
                    Email
                </label>
                <input type="email" id="email" name="email" required
                    class="w-full px-3 py-2 bg-white border border-white rounded-md text-gray-900 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-white focus:border-white"
                    placeholder="Enter your email">
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-white mb-1">
                    Password
                </label>
                <input type="password" id="password" name="password" required
                    class="w-full px-3 py-2 bg-white border border-white rounded-md text-gray-900 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-white focus:border-white"
                    placeholder="Enter your password">
            </div>
            <div class="flex items-center justify-between">
                <div class="flex items-center">
                    <input type="checkbox" id="remember" name="remember"
                        class="h-4 w-4 text-primary border-white rounded focus:ring-white focus:ring-offset-primary">
                    <label for="remember" class="ml-2 block text-sm text-white">
                        Remember me
                    </label>
                </div>
                <a href="#" class="text-sm text-white hover:underline">
                    Forgot password?
                </a>
            </div>
            <button type="submit"
                class="w-full bg-white text-primary py-2 px-4 rounded-md hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-white focus:ring-offset-2 focus:ring-offset-primary">
                Sign In
            </button>
        </form>
    </div>
</body>
</html>
